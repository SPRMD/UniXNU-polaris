name: Polaris UniXNU platform build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Kernel configuration to build"
        required: true
        default: polaris_defconfig
        type: choice
        options:
          - polaris_defconfig
          - polaris_prelink_defconfig

permissions:
  contents: read

concurrency:
  group: polaris-platform-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  DEFCONFIG: ${{ inputs.defconfig || 'polaris_defconfig' }}

jobs:
  host:
    name: Host and ADT checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 clang lld llvm unifdef ninja-build cmake

      - name: Run repository checks
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/check-host.py
          python3 scripts/make-polaris-adt.py --output out/polaris.adt
          python3 scripts/make-polaris-adt.py --output out/polaris-full.adt --ram 8 --cpu-regs 0,0x100,0x200,0x300,0x400,0x500,0x600,0x700
          python3 scripts/check-cpu-prefix.py out/polaris.adt --cmdline "-v serial=3 cpus=1"
          python3 scripts/check-cpu-prefix.py out/polaris-full.adt --cmdline "cpus=4 kt_fixed_zones=120"
          ! python3 scripts/check-cpu-prefix.py out/polaris.adt --cmdline "cpus=5"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-reports
          path: |
            out/host-tests/
            out/polaris.adt
            out/polaris-full.adt

  efi:
    name: EFI and QEMU checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 37987aea410691df3c1e0e146a1bfd6127932149
          path: out/upstream

      - uses: actions/checkout@v4
        with:
          repository: microsoft/mu_basecore
          ref: cfb93724a06ff86ff5ba971413368a7809ee42a5
          path: out/upstream/package/Mu_Basecore

      - name: Install EFI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev python3 clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-system-arm qemu-efi-aarch64
          git -C out/upstream/package/Mu_Basecore submodule update --init --depth 1 MdePkg/Library/BaseFdtLib/libfdt MdePkg/Library/MipiSysTLib/mipisyst BaseTools/Source/C/BrotliCompress/brotli

      - name: Build EFI and run QEMU cases
        run: python3 scripts/check-efi.py --base out/upstream

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: efi-results
          path: |
            out/efi-check/

  kernel:
    name: Darwin 23 source kernel
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 37987aea410691df3c1e0e146a1bfd6127932149
          path: out/upstream

      - name: Install Darwin build tools
        run: |
          brew install cmake ninja unifdef llvm lld
          if [ -d /Applications/Xcode_26.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --find mig
          xcrun --sdk iphoneos --find iig

      - name: Build source kernel and Polaris drivers
        run: python3 scripts/build-platform-kernel.py --base out/upstream -j 4 --defconfig "$DEFCONFIG"

      - name: Preserve build diagnostics
        if: always()
        run: |
          TREE=out/native/polaris/tree
          if [ -d "$TREE/.cache/xnu-work" ] && [ -d "$TREE/build/xnu" ]; then
            tar czf out/native-buildtree.tgz --exclude='.git' --exclude='*.o' --exclude='*.cpo' --exclude='*.a' -C "$TREE" .cache/xnu-work .cache/fakeroot build/xnu
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-kernel-results
          path: |
            out/native/polaris/kernel/
            out/native/polaris/logs/
            out/native-buildtree.tgz

  package:
    name: QEMU check and platform artifacts
    needs: [host, efi, kernel]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: platform-kernel-results
          path: out/kernel

      - uses: actions/download-artifact@v4
        with:
          name: efi-results
          path: out/efi

      - name: Install packaging and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 clang llvm lld mtools

      - name: Validate kernel and assemble ESP directory
        run: |
          test -f out/kernel/kernel.macho
          test -f out/kernel/kernel.json
          python3 scripts/check-platform-kernel.py --kernel out/kernel/kernel.macho --efi out/efi
          python3 scripts/make-payload-esp.py --kernel out/kernel/kernel.macho --efi out/efi --out out/polaris-esp --cpus 1

      - name: Build non-flashable FAT32 platform artifact
        run: |
          truncate -s 128M esp.img
          mformat -i esp.img -v POLARISESP ::
          mcopy -s -i esp.img out/polaris-esp/EFI ::/
          mdir -i esp.img ::/EFI/UniXNU/Payloads/ | tee listing.txt
          cp out/kernel/kernel.macho out/polaris-esp/kernel.macho
          cp out/kernel/kernel.json out/polaris-esp/kernel.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polaris-platform-artifacts
          path: |
            esp.img
            listing.txt
            out/polaris-esp/
            out/platform-check/
