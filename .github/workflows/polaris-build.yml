name: Polaris UniXNU platform build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Kernel configuration to build"
        required: true
        default: polaris_defconfig
        type: choice
        options:
          - polaris_defconfig
          - polaris_prelink_defconfig
          - polaris_ipados17_defconfig
          - polaris_display_defconfig

permissions:
  contents: read

concurrency:
  group: polaris-platform-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  DEFCONFIG: ${{ inputs.defconfig || 'polaris_defconfig' }}

jobs:
  host:
    name: Host and ADT checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 clang lld llvm unifdef ninja-build cmake

      - name: Checkout WOA metadata source
        uses: actions/checkout@v4
        with:
          repository: edk2-porting/WOA-Drivers
          path: out/WOA-Drivers
          fetch-depth: 1
          lfs: false

      - name: Checkout Polaris WOA status source
        uses: actions/checkout@v4
        with:
          repository: n00b69/woa-polaris
          path: out/woa-polaris
          fetch-depth: 1
          lfs: false

      - name: Generate metadata-only WOA evidence
        run: |
          python3 scripts/import-polaris-woa-evidence.py \
            --woa-root out/WOA-Drivers \
            --woa-polaris-root out/woa-polaris \
            --output out/host-tests/polaris-woa-evidence.json

      - name: Assemble source and firmware provenance bundle
        run: |
          python3 scripts/make-polaris-driver-bundle.py \
            --out out/host-tests/polaris-driver-bundle \
            --vendor-root out/WOA-Drivers
          python3 scripts/check-polaris-driver-bundle.py \
            --bundle out/host-tests/polaris-driver-bundle \
            --source-root .

      - name: Run repository checks
        run: |
          python3 scripts/check-workflow-routing.py
          python3 -m unittest discover -s tests -v
          python3 scripts/check-host.py
          python3 scripts/check-polaris-driver-contract.py \
            research/polaris-hardware-contract.json \
            --output out/host-tests/polaris-driver-contract.json
          clang++ -std=c++17 -Wall -Wextra -Werror \
            tests/synaptics_rmi4_protocol_test.cpp \
            -o out/host-tests/synaptics_rmi4_protocol_test
          out/host-tests/synaptics_rmi4_protocol_test
          clang++ -std=c++17 -Wall -Wextra -Werror \
            tests/polaris_transport_protocols_test.cpp \
            -o out/host-tests/polaris_transport_protocols_test
          out/host-tests/polaris_transport_protocols_test
          clang++ -std=c++17 -Wall -Wextra -Werror \
            tests/polaris_pmic_input_test.cpp \
            -o out/host-tests/polaris_pmic_input_test
          out/host-tests/polaris_pmic_input_test
          clang -std=c11 -Wall -Wextra -Werror \
            tests/polaris_a630_policy_test.c \
            -o out/host-tests/polaris_a630_policy_test
          out/host-tests/polaris_a630_policy_test
          clang -std=c11 -Wall -Wextra -Werror \
            tests/polaris_display_panel_test.c \
            -o out/host-tests/polaris_display_panel_test
          out/host-tests/polaris_display_panel_test
          clang -std=c11 -Wall -Wextra -Werror \
            tests/polaris_nfc_policy_test.c \
            -o out/host-tests/polaris_nfc_policy_test
          out/host-tests/polaris_nfc_policy_test
          clang -std=c11 -Wall -Wextra -Werror \
            tests/polaris_camera_policy_test.c \
            -o out/host-tests/polaris_camera_policy_test
          out/host-tests/polaris_camera_policy_test
          clang -std=c11 -Wall -Wextra -Werror \
            tests/polaris_geni_i2c_host.c \
            drivers/PolarisGeniI2c/PolarisGeniI2c.c \
            -o out/host-tests/polaris_geni_i2c_host
          out/host-tests/polaris_geni_i2c_host
          clang -std=c11 -Wall -Wextra -Werror \
            tests/polaris_geni_i2c_resources_test.c \
            -o out/host-tests/polaris_geni_i2c_resources_test
          out/host-tests/polaris_geni_i2c_resources_test
          python3 scripts/make-polaris-adt.py --output out/polaris.adt
          python3 scripts/make-polaris-adt.py --output out/polaris-full.adt --ram 8 --cpu-regs 0,0x100,0x200,0x300,0x400,0x500,0x600,0x700
          python3 scripts/check-cpu-prefix.py out/polaris.adt --cmdline "-v serial=3 cpus=1"
          python3 scripts/check-cpu-prefix.py out/polaris-full.adt --cmdline "cpus=4 kt_fixed_zones=120"
          ! python3 scripts/check-cpu-prefix.py out/polaris.adt --cmdline "cpus=5"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-reports
          path: |
            out/host-tests/
            out/polaris.adt
            out/polaris-full.adt

  efi:
    name: EFI and QEMU checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 37987aea410691df3c1e0e146a1bfd6127932149
          path: out/upstream

      - uses: actions/checkout@v4
        with:
          repository: microsoft/mu_basecore
          ref: cfb93724a06ff86ff5ba971413368a7809ee42a5
          path: out/upstream/package/Mu_Basecore

      - name: Install EFI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev python3 clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-system-arm qemu-efi-aarch64
          git -C out/upstream/package/Mu_Basecore submodule update --init --depth 1 MdePkg/Library/BaseFdtLib/libfdt MdePkg/Library/MipiSysTLib/mipisyst BaseTools/Source/C/BrotliCompress/brotli

      - name: Build EFI and run QEMU cases
        run: python3 scripts/check-efi.py --base out/upstream

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: efi-results
          path: |
            out/efi-check/

  kernel:
    name: Darwin 23 source kernel
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 37987aea410691df3c1e0e146a1bfd6127932149
          path: out/upstream

      - name: Install Darwin build tools
        run: |
          brew install cmake ninja unifdef llvm lld
          if [ -d /Applications/Xcode_26.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --find mig
          xcrun --sdk iphoneos --find iig

      - name: Build source kernel and Polaris drivers
        run: python3 scripts/build-platform-kernel.py --base out/upstream -j 4 --defconfig "$DEFCONFIG"

      - name: Fetch iPadOS stage inputs
        if: env.DEFCONFIG == 'polaris_ipados17_defconfig'
        run: |
          python3 scripts/fetch-ios-stage-inputs.py \
            --base out/upstream \
            --out out/native \
            KernelCache OS Cryptex1,SystemOS StaticTrustCache Cryptex1,SystemTrustCache

      - name: Preserve build diagnostics
        if: always()
        run: |
          TREE=out/native/polaris/tree
          if [ -d "$TREE/.cache/xnu-work" ] && [ -d "$TREE/build/xnu" ]; then
            tar czf out/native-buildtree.tgz --exclude='.git' --exclude='*.o' --exclude='*.cpo' --exclude='*.a' -C "$TREE" .cache/xnu-work .cache/fakeroot build/xnu
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-kernel-results
          path: |
            out/native/polaris/kernel/
            out/native/polaris/logs/
            out/native/polaris/tree/build/polaris-board-probe/
            out/native/polaris/tree/build/polaris-hardware-services/
            out/native/polaris/tree/build/polaris-pmic-input/
            out/native/polaris/tree/build/polaris-pmic-runtime/
            out/native/polaris/tree/build/polaris-hid-input/
            out/native/polaris/tree/build/polaris-synaptics-touch/
            out/native/polaris/tree/build/polaris-touch-runtime/
            out/native/polaris/tree/build/polaris-transport-contracts/
            out/native/polaris/tree/build/polaris-peripheral-contracts/
            out/native/polaris/tree/build/polaris-nfc-contract/
            out/native/polaris/tree/build/polaris-camera-contract/
            out/native/polaris/tree/build/polaris-a630-probe/
            out/native/polaris/tree/build/polaris-display-contract/
            out/native/polaris/tree/build/polaris-runtime/
            out/native/polaris/tree/build/gop-framebuffer/
            out/native/ipsw/
            out/native-buildtree.tgz

  firmware:
    name: Polaris UEFI firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EDK2_MSM_COMMIT: e1952621f419f8db60ed28271264e1b5184c571d
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: edk2-porting/edk2-msm
          ref: e1952621f419f8db60ed28271264e1b5184c571d
          path: out/edk2-msm
          fetch-depth: 1
          submodules: recursive

      - name: Install firmware build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential uuid-dev iasl nasm clang llvm \
            gcc-aarch64-linux-gnu device-tree-compiler \
            python3 python3-pil gettext libfreetype6-dev

      - name: Build Polaris firmware
        working-directory: out/edk2-msm
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out/edk2-output"
          ./build.sh --device polaris \
            --outputdir "$GITHUB_WORKSPACE/out/edk2-output"

      - name: Write firmware provenance
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          build = Path('out/edk2-output')
          root = Path('out/firmware')
          root.mkdir(parents=True, exist_ok=True)
          images = sorted(build.glob('boot-polaris*.img'))
          if len(images) != 1:
              raise SystemExit(f'expected one Polaris boot image, found {len(images)}')
          with images[0].open('rb') as stream:
              if stream.read(8) != b'ANDROID!':
                  raise SystemExit('Polaris firmware is not an Android boot image')
          shutil.copy2(images[0], root / images[0].name)
          files = [root / images[0].name]
          payload = []
          for p in files:
              with p.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              payload.append({
                  'path': str(p.relative_to(root)).replace('\\', '/'),
                  'bytes': p.stat().st_size,
                  'sha256': digest,
              })
          report = {
              'board': 'xiaomi,polaris',
              'repository': 'edk2-porting/edk2-msm',
              'commit': os.environ['EDK2_MSM_COMMIT'],
              'hardware_tested': False,
              'files': payload,
          }
          (root / 'firmware-provenance.json').write_text(json.dumps(report, indent=2) + '\n')
          PY

      - name: Validate Polaris private-firmware contract
        run: |
          python3 scripts/check-polaris-firmware.py \
            --contract research/polaris-firmware-contract.json \
            --output out/firmware/polaris-firmware-contract.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polaris-firmware
          path: out/firmware/

  package:
    name: QEMU check and platform artifacts
    if: ${{ inputs.defconfig != 'polaris_prelink_defconfig' && inputs.defconfig != 'polaris_ipados17_defconfig' }}
    needs: [host, efi, kernel, firmware]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: platform-kernel-results
          path: out/kernel

      - uses: actions/download-artifact@v4
        with:
          name: efi-results
          path: out/efi

      - uses: actions/download-artifact@v4
        with:
          name: polaris-firmware
          path: out/firmware

      - uses: actions/download-artifact@v4
        with:
          name: host-reports
          path: out/host

      - name: Normalize host report layout
        run: |
          # upload-artifact keeps the least common ancestor of the host
          # reports.  With the bundle plus top-level ADT reports that can be
          # out/host/host-tests/polaris-driver-bundle; normalize it so the
          # package builders consume one stable path.
          if [ -d out/host/host-tests/polaris-driver-bundle ] && [ ! -e out/host/polaris-driver-bundle ]; then
            mv out/host/host-tests/polaris-driver-bundle out/host/polaris-driver-bundle
          fi
          test -d out/host/polaris-driver-bundle

      - name: Install packaging and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 clang llvm lld mtools

      - name: Validate kernel and assemble ESP directory
        run: |
          # The ordinary platform package consumes the plain source kernel.
          # The iPadOS-stage job below selects kernel-prelinked.macho instead.
          KERNEL=$(find out/kernel -type f -name kernel.macho -print -quit)
          test -n "$KERNEL"
          cp "$KERNEL" out/kernel.macho
          cp "${KERNEL%.macho}.json" out/kernel.json
          EFI=$(find out/efi -type f -path '*/efi/Build/Out/AARCH64-DEBUG/UniXNU.efi' -print -quit)
          test -n "$EFI"
          EFI_ROOT=${EFI%/efi/Build/Out/AARCH64-DEBUG/UniXNU.efi}
          python3 scripts/check-platform-kernel.py --kernel out/kernel.macho --efi "$EFI_ROOT"
          python3 scripts/make-payload-esp.py --kernel out/kernel.macho --efi "$EFI_ROOT" --out out/polaris-esp --cpus 1

      - name: Build non-flashable FAT32 platform artifact
        run: |
          truncate -s 128M esp.img
          mformat -i esp.img -v POLARISESP ::
          mcopy -s -i esp.img out/polaris-esp/EFI ::/
          mdir -i esp.img ::/EFI/UniXNU/Payloads/ | tee listing.txt
          cp out/kernel.macho out/polaris-esp/kernel.macho
          cp out/kernel.json out/polaris-esp/kernel.json

      - name: Assemble guarded one-click package
        run: |
          python3 scripts/make-polaris-package.py \
            --esp out/polaris-esp \
            --esp-image esp.img \
            --kernel out/kernel.macho \
            --firmware out/firmware \
            --driver-bundle out/host/polaris-driver-bundle \
            --out out/polaris-one-click
          python3 scripts/check-polaris-package.py --package out/polaris-one-click
          test "$(python3 -c 'import json; print(json.load(open("out/polaris-one-click/manifest.json"))["flashable"])')" = "False"
          (cd out/polaris-one-click && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polaris-platform-artifacts
          path: |
            esp.img
            listing.txt
            out/polaris-esp/
            out/platform-check/
            out/firmware/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polaris-one-click-package
          path: out/polaris-one-click/

  ios-stage:
    name: Experimental iPadOS 17 stage
    if: ${{ inputs.defconfig == 'polaris_ipados17_defconfig' }}
    needs: [host, efi, kernel, firmware]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: platform-kernel-results
          path: out/kernel

      - uses: actions/download-artifact@v4
        with:
          name: efi-results
          path: out/efi

      - uses: actions/download-artifact@v4
        with:
          name: polaris-firmware
          path: out/firmware

      - uses: actions/download-artifact@v4
        with:
          name: host-reports
          path: out/host

      - name: Normalize host report layout
        run: |
          if [ -d out/host/host-tests/polaris-driver-bundle ] && [ ! -e out/host/polaris-driver-bundle ]; then
            mv out/host/host-tests/polaris-driver-bundle out/host/polaris-driver-bundle
          fi
          test -d out/host/polaris-driver-bundle

      - name: Install iOS-stage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mtools util-linux python3 python3-pip
          python3 -m pip install --user --break-system-packages liblzfse

      - name: Normalize build artifacts
        run: |
          # The iPadOS stage requires the separate prelinked image. The plain
          # source kernel intentionally lacks the original iPadOS components
          # and is rejected by build-ios-stage.py.
          KERNEL=$(find out/kernel -type f -name kernel-prelinked.macho -print -quit)
          test -n "$KERNEL"
          mkdir -p out/ios-inputs
          cp "$KERNEL" out/ios-inputs/kernel.macho
          cp "${KERNEL%.macho}.json" out/ios-inputs/kernel.json
          EFI=$(find out/efi -type f -path '*/efi/Build/Out/AARCH64-DEBUG/UniXNU.efi' -print -quit)
          test -n "$EFI"
          EFI_ROOT=${EFI%/efi/Build/Out/AARCH64-DEBUG/UniXNU.efi}
          printf '%s\n' "$EFI_ROOT" > out/ios-inputs/efi-root.txt
          find out/kernel -type f \( -name '044-76040-038.dmg' -o -name '044-76034-038.dmg' \) -exec cp {} out/ios-inputs/ \;
          find out/kernel -type f -name '*.dmg.trustcache' -exec cp {} out/ios-inputs/ \;
          test -f out/ios-inputs/044-76040-038.dmg
          test -f out/ios-inputs/044-76034-038.dmg
          test -f out/ios-inputs/044-76040-038.dmg.trustcache
          test -f out/ios-inputs/044-76034-038.dmg.trustcache
          python3 scripts/check-ios-stage-inputs.py \
            --root out/kernel \
            --output out/ios-inputs/ipsw-inputs.json
          python3 scripts/check-ios-stage-inputs.py \
            --root out/ios-inputs \
            --output out/ios-inputs/ios-input-hashes.json

      - name: Generate Polaris iPad identity ADT
        run: |
          python3 scripts/make-polaris-adt.py \
            --output out/ios-inputs/polaris-ios.adt \
            --ram 6 --ipad-identity --include-ufs --trust-cache

      - name: Assemble guarded iPadOS stage package
        run: |
          EFI_ROOT=$(cat out/ios-inputs/efi-root.txt)
          python3 scripts/build-ios-stage.py \
            --kernel out/ios-inputs/kernel.macho \
            --adt out/ios-inputs/polaris-ios.adt \
            --efi "$EFI_ROOT" \
            --static-trust out/ios-inputs/044-76040-038.dmg.trustcache \
            --system-trust out/ios-inputs/044-76034-038.dmg.trustcache \
            --os out/ios-inputs/044-76040-038.dmg \
            --system-os out/ios-inputs/044-76034-038.dmg \
            --out out/ios-stage \
            --package out/polaris-ios-one-click \
            --firmware out/firmware \
            --driver-bundle out/host/polaris-driver-bundle \
            --input-hash-report out/ios-inputs/ios-input-hashes.json
          python3 scripts/check-polaris-package.py --package out/polaris-ios-one-click
          test "$(python3 -c 'import json; print(json.load(open("out/polaris-ios-one-click/manifest.json"))["flashable"])')" = "False"
          (cd out/polaris-ios-one-click && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polaris-ios-stage
          path: |
            out/ios-inputs/ipsw-inputs.json
            out/ios-stage/
            out/polaris-ios-one-click/
